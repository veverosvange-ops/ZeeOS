name: Build Unsigned IPA

on:
  push:
  pull_request:
  workflow_dispatch: # Memungkinkan Anda menjalankan build secara manual dari tab Actions

jobs:
  build:
    name: ZeeOs (Unsigned)
    runs-on: macos-latest # Membutuhkan environment macOS untuk Xcode

    steps:
      # 1. Unduh kode repositori
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Atur versi Xcode (sesuaikan dengan kebutuhan proyek Anda)
      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      # 3. Build proyek menggunakan xcodebuild (tanpa signing / unsigned)
      - name: Build App
        run: |
          # Cari file .xcodeproj atau .xcworkspace secara otomatis
          PROJECT_FILE=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          SCHEME_NAME=$(basename "$PROJECT_FILE" .xcodeproj)
          
          echo "Found project: $PROJECT_FILE"
          echo "Using scheme: $SCHEME_NAME"

          # Buat folder build
          mkdir -p build/Release-iphoneos

          # Proses kompilasi (Build for archiving/running tanpa signing)
          xcodebuild -project "$PROJECT_FILE" \
            -scheme "$SCHEME_NAME" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DSTROOT="$PWD/build/dst" \
            install

      # 4. Bungkus hasil build (.app) menjadi format .ipa
      - name: Create Unsigned IPA
        run: |
          mkdir -p Payload
          # Pindahkan hasil .app ke dalam folder Payload
          cp -R build/dst/Applications/*.app Payload/
          
          # Kompres menjadi .ipa
          zip -r UnsignedApp.ipa Payload
          rm -rf Payload

      # 5. Unggah file .ipa agar bisa diunduh dari halaman GitHub Actions
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-IPA
          path: UnsignedApp.ipa
