name: Build Unsigned IPA

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App (Unsigned)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build App
        run: |
          # Cari file project atau workspace
          if ls *.xcworkspace 1> /dev/null 2>&1; then
            WORKSPACE_FILE=$(find . -maxdepth 2 -name "*.xcworkspace" | head -n 1)
            BUILD_ARGS="-workspace $WORKSPACE_FILE"
          else
            PROJECT_FILE=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
            BUILD_ARGS="-project $PROJECT_FILE"
          fi

          # Dapatkan scheme pertama yang tersedia
          SCHEME_NAME=$(xcodebuild $BUILD_ARGS -list -json | tr -d '\n' | grep -o '"schemes":\[[^]]*\]' | sed 's/"schemes":\[//;s/\]//;s/"//g;s/,/ /g' | awk '{print $1}')
          
          echo "Detected Scheme: $SCHEME_NAME"

          if [ -z "$SCHEME_NAME" ]; then
            echo "Error: No valid scheme found!"
            exit 1
          fi

          mkdir -p build/Release-iphoneos

          # Build dengan mengubah nama tampilan aplikasi menjadi ZeeOS
          xcodebuild $BUILD_ARGS \
            -scheme "$SCHEME_NAME" \
            -sdk iphoneos \
            -configuration Release \
            PRODUCT_NAME="ZeeOS" \
            INFOPLIST_KEY_CFBundleDisplayName="ZeeOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DSTROOT="$PWD/build/dst" \
            install

      - name: Create Unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/dst/Applications/*.app Payload/
          zip -r ZeeOS.ipa Payload
          rm -rf Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeeOS-Unsigned-IPA
          path: ZeeOS.ipa
