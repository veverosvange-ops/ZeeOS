
name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Target bundle identifier
        required: false
        default: com.zeeos.app
        type: string
      project_name:
        description: Output IPA name
        required: false
        default: ZeeOS
        type: string
      scheme:
        description: Xcode scheme
        required: false
        default: ZeeOS
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Locate Xcode project
        id: locate
        env:
          INPUT_SCHEME: ${{ inputs.scheme }}
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"

          PROJECT=$(find "$ROOT" -name '*.xcodeproj' -type d -print -quit)
          WORKSPACE=$(find "$ROOT" -name '*.xcworkspace' -type d -not -path '*/Pods/*' -print -quit)

          if [ -z "$PROJECT" ] && [ -z "$WORKSPACE" ]; then
            echo "No Xcode project or workspace found"
            exit 1
          fi

          if [ -n "$INPUT_SCHEME" ]; then
            SCHEME="$INPUT_SCHEME"
          elif [ -n "$WORKSPACE" ]; then
            SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" | /usr/bin/python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("workspace",{}).get("schemes") or [""])[0])')
          else
            SCHEME=$(xcodebuild -list -json -project "$PROJECT" | /usr/bin/python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("project",{}).get("schemes") or [""])[0])')
          fi

          [ -n "$SCHEME" ] || exit 1

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

          echo "Using scheme: $SCHEME"

      - name: Build unsigned archive
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
          WORKSPACE: ${{ steps.locate.outputs.workspace }}
          SCHEME: ${{ steps.locate.outputs.scheme }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -euo pipefail

          ARCHIVE="$RUNNER_TEMP/App.xcarchive"

          OPTIONS=(
            -scheme "$SCHEME"
            -sdk iphoneos
            -configuration Release
            -destination "generic/platform=iOS"
            -archivePath "$ARCHIVE"
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=
            "PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID"
          )

          if [ -n "$WORKSPACE" ]; then
            xcodebuild archive \
              -workspace "$WORKSPACE" \
              "${OPTIONS[@]}" \
              2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
          else
            xcodebuild archive \
              -project "$PROJECT" \
              "${OPTIONS[@]}" \
              2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
          fi

      - name: Package unsigned IPA
        env:
          IPA_NAME: ${{ inputs.project_name }}
        run: |
          set -euo pipefail

          APP_PATH=$(find \
            "$RUNNER_TEMP/App.xcarchive/Products/Applications" \
            -maxdepth 1 \
            -name '*.app' \
            -type d \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app produced"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/Payload"

          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"

          IPA_PATH="$RUNNER_TEMP/${IPA_NAME}.ipa"

          cd "$RUNNER_TEMP"

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            Payload "$IPA_PATH"

          if [ ! -s "$IPA_PATH" ]; then
            echo "ERROR: IPA missing or empty"
            exit 1
          fi

          echo "IPA generated:"
          ls -lh "$IPA_PATH"

      - name: Verify IPA integrity
        env:
          IPA_NAME: ${{ inputs.project_name }}
        run: |
          set -euo pipefail

          IPA_PATH="$RUNNER_TEMP/${IPA_NAME}.ipa"

          echo "Checking ZIP integrity..."
          unzip -t "$IPA_PATH"

          echo "Checking Payload structure..."

          if ! unzip -Z -1 "$IPA_PATH" | \
            grep -E '^Payload/[^/]+\.app/Info\.plist$' \
            > /dev/null; then
            echo "ERROR: Invalid IPA structure"
            exit 1
          fi

          echo "IPA verification successful"

      - name: Create downloadable ZIP
        env:
          IPA_NAME: ${{ inputs.project_name }}
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP"

          zip -0 "${IPA_NAME}-download.zip" \
            "${IPA_NAME}.ipa"

          unzip -t "${IPA_NAME}-download.zip"

          echo "Download ZIP verified"
          ls -lh "${IPA_NAME}-download.zip"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZeeOS-unsigned-ipa
          path: ${{ runner.temp }}/${{ inputs.project_name }}.ipa
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload downloadable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ZeeOS-download-zip
          path: ${{ runner.temp }}/${{ inputs.project_name }}-download.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZeeOS-build-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build summary
        if: always()
        env:
          IPA_NAME: ${{ inputs.project_name }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          SCHEME: ${{ steps.locate.outputs.scheme }}
        run: |
          {
            echo "## ZeeOS Unsigned IPA"
            echo ""
            echo "Name: $IPA_NAME"
            echo "Bundle ID: $BUNDLE_ID"
            echo "Scheme: $SCHEME"
            echo "Signing: Disabled"
            echo ""
            echo "Artifacts:"
            echo "- ZeeOS-unsigned-ipa"
            echo "- ZeeOS-download-zip"
            echo "- ZeeOS-build-log"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/Payload"
          rm -rf "$RUNNER_TEMP/App.xcarchive"
